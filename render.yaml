databases:
  - name: phd-amirkabir-db
    plan: free
    databaseName: phd_hub
    user: phd_user

services:
  - type: web
    name: phd-amirkabir
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: phd-amirkabir-db
          property: connectionString
